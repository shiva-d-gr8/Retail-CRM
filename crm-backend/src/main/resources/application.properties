spring.application.name=crm
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=jdbc:h2:file:./data/retailmax;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Automation rule: flag open contacts with no status change for this many days
crm.automation.followup-days=3

crm.jwt.expiration-minutes=60
crm.auth.default-username=${CRM_DEFAULT_USERNAME:shivam}